<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 -5 445 535" width="445" height="535">
  <defs>
    <clipPath id="circ">
      <circle cx="335" cy="315" r="208"/>
    </clipPath>
    <clipPath id="below">
      <path d="M100,356 L130,356 C340,380 470,280 498,143 L600,143 L600,600 L100,600 Z"/>
    </clipPath>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="-20" width="600" height="600">
      <rect x="0" y="-20" width="600" height="600" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="15" stroke-linejoin="round">
        <path d="M130,354 C250,335 345,245 355,100 L318,88 L460,3 C445,190 330,325 130,354 Z"/>
        <path d="M130,356 C340,380 470,280 498,143 L535,140 L460,3 C445,190 330,325 130,356 Z"/>
      </g>
    </mask>
    <linearGradient id="orange" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a23b"/>
      <stop offset="1" stop-color="#ec7d1f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ee6a2a"/>
      <stop offset="0.5" stop-color="#e8442a"/>
      <stop offset="1" stop-color="#e8412a"/>
    </linearGradient>
  </defs>

  <!-- Lingkaran: pie + bar chart (transparan) -->
  <g mask="url(#gap)">
    <g clip-path="url(#circ)">
      <path d="M120,345 C125,210 220,120 346,108 C352,200 300,280 240,315 C200,336 160,345 120,345 Z" fill="#0b4a75"/>
      <g clip-path="url(#below)">
        <rect x="130" y="100" width="75"  height="450" fill="#039be0"/>
        <rect x="238" y="100" width="80"  height="450" fill="#0b4a75"/>
        <rect x="349" y="100" width="79"  height="450" fill="#039be0"/>
        <rect x="460" y="100" width="100" height="450" fill="#0b4a75"/>
      </g>
    </g>
  </g>

  <!-- Panah -->
  <path d="M130,354 C250,335 345,245 355,100 L318,88 L460,3 C445,190 330,325 130,354 Z" fill="url(#orange)"/>
  <path d="M130,356 C340,380 470,280 498,143 L535,140 L460,3 C445,190 330,325 130,356 Z" fill="url(#red)"/>
</svg>
