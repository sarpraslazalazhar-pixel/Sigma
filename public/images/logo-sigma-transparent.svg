<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 40 1330 530" width="1330" height="530">
  <defs>
    <clipPath id="circ">
      <circle cx="250" cy="353" r="206"/>
    </clipPath>
    <!-- mask: celah transparan di sekitar panah -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1400" height="700">
      <rect width="1400" height="700" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round">
        <path d="M52,398 C210,392 335,300 372,125 L378,45 L236,128 L302,124 C282,232 180,345 52,398 Z"/>
        <path d="M52,398 C250,418 392,325 400,176 L452,182 L378,45 L372,125 C335,300 210,392 52,398 Z"/>
      </g>
    </mask>
    <linearGradient id="orange" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a23b"/>
      <stop offset="1" stop-color="#ec7d1f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ee6a2a"/>
      <stop offset="0.5" stop-color="#e8442a"/>
      <stop offset="1" stop-color="#e8412a"/>
    </linearGradient>
  </defs>

  <!-- Lingkaran: pie + bar chart (latar transparan) -->
  <g mask="url(#gap)">
    <g clip-path="url(#circ)">
      <path d="M40,385 C55,250 150,160 264,148 C266,205 240,265 195,305 C150,345 95,372 40,385 Z" fill="#0b4a75"/>
      <rect x="52"  y="405" width="72" height="160" fill="#039be0"/>
      <rect x="158" y="395" width="75" height="170" fill="#0b4a75"/>
      <rect x="268" y="330" width="77" height="235" fill="#039be0"/>
      <rect x="378" y="225" width="85" height="340" fill="#0b4a75"/>
    </g>
  </g>

  <!-- Panah -->
  <path d="M52,398 C210,392 335,300 372,125 L378,45 L236,128 L302,124 C282,232 180,345 52,398 Z" fill="url(#orange)"/>
  <path d="M52,398 C250,418 392,325 400,176 L452,182 L378,45 L372,125 C335,300 210,392 52,398 Z" fill="url(#red)"/>

  <!-- Teks -->
  <text x="495" y="510" font-family="Bahnschrift, 'DIN Alternate', 'DIN 1451', 'Arial Narrow', Arial, sans-serif"
        font-size="300" font-weight="700" fill="#039be0"
        textLength="865" lengthAdjust="spacingAndGlyphs">SIGMA</text>

  <text x="478" y="558" font-family="Bahnschrift, 'DIN Alternate', 'DIN 1451', 'Arial Narrow', Arial, sans-serif"
        font-size="42" font-weight="700" fill="#0b4a75"
        textLength="885" lengthAdjust="spacingAndGlyphs">SISTEM INFORMASI &amp; MONITORING ANGGARAN</text>
</svg>
